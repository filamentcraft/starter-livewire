name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      HAS_LICENSE: ${{ secrets.FILAMENTCRAFT_KEY != '' }}
      COMPOSER_AUTH: '{"http-basic":{"packages.filamentcraft.dev":{"username":"${{ secrets.FILAMENTCRAFT_EMAIL }}","password":"${{ secrets.FILAMENTCRAFT_KEY }}"}}}'

    steps:
      - name: Explain skipped run
        if: env.HAS_LICENSE != 'true'
        run: echo "::notice::Add FILAMENTCRAFT_EMAIL and FILAMENTCRAFT_KEY as repository secrets to install FilamentCraft and run the checks."

      - name: Checkout code
        if: env.HAS_LICENSE == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        if: env.HAS_LICENSE == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        if: env.HAS_LICENSE == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Application
        if: env.HAS_LICENSE == 'true'
        run: composer setup

      - name: Run CI Checks
        if: env.HAS_LICENSE == 'true'
        run: composer ci:check
